# ローカル開発用に api と PostgreSQL をまとめて立ち上げる。
#
#   docker compose up -d --build     # 起動（db -> migrate -> api の順に立ち上がる）
#   curl localhost:8080/health       # => "server OK!"
#   docker compose down              # 停止（-v を付けるとデータも消える）
#
# 本番（ECS Fargate + RDS）ではこのファイルは使わない。db サービスは
# ローカルでの RDS の代わりで、接続情報は .env で上書きできる（.env.example 参照）。

# api と migrate で同じ接続先を使う。片方だけ直して食い違うのを避けるため、
# YAML のアンカーで 1 箇所にまとめている。
x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-life}:${POSTGRES_PASSWORD:-life}@db:5432/${POSTGRES_DB:-life}?sslmode=disable

services:
  api:
    build: .
    # migrate と同じイメージを使い回すため、名前を固定しておく。
    image: life-api:local
    # Dockerfile の CMD と同じ値。イメージ側の既定に依存せず、
    # 0.0.0.0 で listen していることをこのファイル単体で読めるようにしておく。
    command: ["--host", "container"]
    ports:
      - "8080:8080"
    environment: *database-url
    depends_on:
      migrate:
        # マイグレーションが正常終了してから api を起動する。api 自身は
        # スキーマを適用しないので、この順序が崩れるとテーブルの無い DB に繋ぐことになる。
        condition: service_completed_successfully
    restart: unless-stopped

  # スキーマ適用専用。起動しっぱなしにはせず、up を流して終了する一回きりのサービス。
  # ECS でも同じイメージの entryPoint だけ差し替えて、単発タスクとして流す想定。
  migrate:
    build: .
    image: life-api:local
    entrypoint: ["/life-migrate"]
    command: ["up"]
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy
    # 終了コード 0 で終わるのが正常。再起動されると
    # service_completed_successfully がいつまでも満たされない。
    restart: "no"

  db:
    # 18 から PGDATA が /var/lib/postgresql/18/docker に移ったため、
    # ボリュームは data ではなく /var/lib/postgresql ごとマウントする。
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-life}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-life}
      POSTGRES_DB: ${POSTGRES_DB:-life}
    ports:
      # psql や GUI クライアントから覗けるように公開する。127.0.0.1 に絞って
      # 同じ LAN の他マシンから開発 DB が見えないようにしておく。
      # ホスト側で別の Postgres が 5432 を使っていて bind に失敗する場合は、
      # POSTGRES_PORT でずらす（コンテナ間は db:5432 のままなので api には影響しない）。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 を付けて TCP で確かめる。既定の Unix ソケット越しだと、
      # 初回起動（pgdata が空）のときに誤って healthy になる。postgres の
      # entrypoint は initdb のあと listen_addresses='' の一時サーバを立てるので、
      # その最中はソケットには応答するが TCP は繋がらない。ここで healthy にすると
      # migrate が接続を拒否されて exit 1 し、api の待ち条件が永久に満たされない。
      #
      # $$ は compose の変数展開を抑止するエスケープ（コンテナ内のシェルに $ で渡る）。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      # 初期化中の失敗で retries を使い切らないための猶予。
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
