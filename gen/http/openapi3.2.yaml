    /tags/{id}:
        delete:
            tags:
                - tags
            summary: delete tags
            description: Delete a tag and detach it from every entry
            operationId: tags#delete
            parameters:
                - name: id
                  in: path
                  description: Tag ID
                  required: true
                  schema:
                    type: integer
                    description: Tag ID
                    example: 7479300308791975858
                    format: int64
                  example: 5586897858818698533
            responses:
                "204":
                    description: No Content response.
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: 'not_found: Not Found response.'
                    content:
                        application/vnd.goa.error:
                            schema:
