                "409":
                    description: 'conflict: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
    /users:
        post:
            tags:
                - users
            summary: register users
            description: Register a new user
            operationId: users#register
            requestBody:
                description: Request body for register.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Credentials'
                        example:
                            email: c59
                            password: "082"
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                            example:
                                created_at: "1996-12-04T02:46:36Z"
                                email: franco.schneider@sawayn.biz
                                id: 1263124488198266759
                "400":
                    description: 'password_too_long: Bad Request response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: 'conflict: Conflict response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /users/login:
        post:
            tags:
                - users
            summary: login users
            description: Issue a JWT for the given credentials
            operationId: users#login
            requestBody:
                description: Request body for login.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequestBody'
                        example:
                            email: Corrupti distinctio dolorem adipisci odio eum enim.
                            password: Itaque explicabo et aperiam.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                            example:
                                access_token: Quaerat at temporibus placeat quia.
                                expires_in: 1538577738388422323
                                token_type: Bearer
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
    /users/me:
        get:
            tags:
                - users
            summary: me users
            description: Return the authenticated user
            operationId: users#me
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                            example:
                                created_at: "1973-05-15T20:50:08Z"
                                email: furman.lowe@senger.info
                                id: 4753831169246844214
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
            security:
                - jwt_header_Authorization: []
components:
    schemas:
        CreateRequestBody:
            type: object
            properties:
                body:
                    type: string
                    example: Temporibus neque cumque fuga sit quae esse.
                entry_date:
                    type: string
                    description: 記録日
                    example: "1994-04-12"
                    format: date
                kind:
                    type: string
                    example: diary
                    enum:
                        - til
                        - diary
                tags:
                    type: array
                    items:
                        type: string
                        example: co
                        pattern: ^\S(.*\S)?$
                        minLength: 1
                        maxLength: 50
                    description: タグ名の一覧
                    example:
                        - go
                        - goa
                    maxItems: 20
                title:
                    type: string
                    example: u
                    minLength: 1
            description: Request body for create.
            example:
                body: Temporibus neque cumque fuga sit quae esse.
                entry_date: "1994-04-12"
                kind: diary
                tags:
                    - go
                    - goa
                title: u
            required:
                - title
                - entry_date
                - kind
        CreateResponseBody:
            type: object
            properties:
                body:
                    type: string
                    example: Ut iste veniam mollitia.
                created_at:
                    type: string
                    example: "1990-06-20T15:39:26Z"
                    format: date-time
                entry_date:
                    type: string
                    description: 記録日
                    example: "1970-02-24"
                    format: date
                id:
                    type: integer
                    example: 1587168276706967770
                    format: int64
                kind:
                    type: string
                    example: til
                    enum:
                        - til
                        - diary
                tags:
                    type: array
                    items:
                        type: string
                        example: k4
                        pattern: ^\S(.*\S)?$
                        minLength: 1
                        maxLength: 50
                    description: タグ名の一覧
                    example:
                        - go
                        - goa
                    maxItems: 20
                title:
                    type: string
                    example: ri
                    minLength: 1
                updated_at:
                    type: string
                    example: "2011-10-20T03:00:30Z"
                    format: date-time
                user_id:
                    type: integer
                    example: 535544025447781906
                    format: int64
            example:
                body: Ut iste veniam mollitia.
                created_at: "1990-06-20T15:39:26Z"
                entry_date: "1970-02-24"
                id: 1587168276706967770
                kind: til
                tags:
                    - go
                    - goa
                title: ri
                updated_at: "2011-10-20T03:00:30Z"
                user_id: 535544025447781906
            required:
                - tags
                - title
                - entry_date
                - kind
        Credentials:
            type: object
            properties:
                email:
                    type: string
                    description: メールアドレス（大文字小文字は区別しない）
                    example: c59
                    format: email
                    maxLength: 254
                password:
                    type: string
                    description: パスワード（8 文字以上、72 バイト以内）
                    example: "082"
                    minLength: 8
                    maxLength: 72
            description: Request body for register.
            example:
                email: c59
                password: "082"
            required:
                - email
                - password
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            description: Error response result type
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        Journal:
            type: object
            properties:
                body:
                    type: string
                    example: Est ut omnis voluptates omnis et neque.
                created_at:
                    type: string
                    example: "1990-12-09T12:52:10Z"
                    format: date-time
                entry_date:
                    type: string
                    description: 記録日
                    example: "1987-08-29"
                    format: date
                id:
                    type: integer
                    example: 3312195076812813890
                    format: int64
                kind:
                    type: string
                    example: til
                    enum:
                        - til
                        - diary
                tags:
                    type: array
                    items:
                        type: string
                        example: s
                        pattern: ^\S(.*\S)?$
                        minLength: 1
                        maxLength: 50
                    description: タグ名の一覧
                    example:
                        - go
                        - goa
                    maxItems: 20
                title:
                    type: string
                    example: j
                    minLength: 1
                updated_at:
                    type: string
                    example: "2004-10-20T00:36:43Z"
                    format: date-time
                user_id:
                    type: integer
                    example: 8220775752495052168
                    format: int64
            description: A journal entry
            example:
                body: Est ut omnis voluptates omnis et neque.
                created_at: "1990-12-09T12:52:10Z"
                entry_date: "1987-08-29"
                id: 3312195076812813890
                kind: til
                tags:
                    - go
                    - goa
                title: j
                updated_at: "2004-10-20T00:36:43Z"
                user_id: 8220775752495052168
            required:
                - tags
                - title
                - entry_date
                - kind
        LoginRequestBody:
            type: object
            properties:
                email:
                    type: string
                    description: メールアドレス（大文字小文字は区別しない）
                    example: Corrupti distinctio dolorem adipisci odio eum enim.
                password:
                    type: string
                    example: Itaque explicabo et aperiam.
            description: Request body for login.
            example:
                email: Corrupti distinctio dolorem adipisci odio eum enim.
                password: Itaque explicabo et aperiam.
            required:
                - email
                - password
        Tag:
            type: object
            properties:
                entry_count:
                    type: integer
                    description: このタグが付いている記録の数
                    example: 9078299880832848833
                    format: int64
                id:
                    type: integer
                    example: 761552026747256846
                    format: int64
                name:
                    type: string
                    example: "n"
                    pattern: ^\S(.*\S)?$
                    minLength: 1
                    maxLength: 50
            description: A tag owned by the authenticated user
            example:
                entry_count: 9078299880832848833
                id: 761552026747256846
                name: "n"
            required:
                - id
                - name
                - entry_count
        TokenResponse:
            type: object
            properties:
                access_token:
                    type: string
                    description: JWT
                    example: Quaerat at temporibus placeat quia.
                expires_in:
                    type: integer
                    description: 有効期限までの秒数
                    example: 1538577738388422323
                    format: int64
                token_type:
                    type: string
                    description: 常に Bearer
                    example: Bearer
                    enum:
                        - Bearer
            description: Issued JWT
            example:
                access_token: Quaerat at temporibus placeat quia.
                expires_in: 1538577738388422323
                token_type: Bearer
            required:
                - access_token
                - token_type
                - expires_in
        UpdateRequestBody:
            type: object
            properties:
                name:
                    type: string
                    description: 新しい名前
                    example: n2f
                    pattern: ^\S(.*\S)?$
                    minLength: 1
                    maxLength: 50
            description: Request body for update.
            example:
                name: n2f
            required:
                - name
        User:
            type: object
            properties:
                created_at:
                    type: string
                    example: "1996-12-04T02:46:36Z"
                    format: date-time
                email:
                    type: string
                    example: franco.schneider@sawayn.biz
                    format: email
                id:
                    type: integer
                    example: 1263124488198266759
                    format: int64
            description: A registered user
            example:
                created_at: "1996-12-04T02:46:36Z"
                email: franco.schneider@sawayn.biz
                id: 1263124488198266759
            required:
                - id
                - email
                - created_at
    securitySchemes:
        jwt_header_Authorization:
            type: http
            description: 'Authorization: Bearer <JWT>. users.login で発行したトークンを渡す'
            scheme: bearer
            bearerFormat: JWT
tags:
    - name: entries
      description: Journal entries of the authenticated user
    - name: tags
      description: Tags of the authenticated user
    - name: health
      description: health check this server
    - name: users
      description: User registration and authentication
