                  in: path
                  description: Entry ID
                  required: true
                  schema:
                    type: integer
                    description: Entry ID
                    example: 5830450457673791293
                    format: int64
                  example: 5251399647721636389
            responses:
                "204":
                    description: No Content response.
                "401":
                    description: 'unauthorized: Unauthorized response.'
                    content:
                        application/vnd.goa.error:
                            schema:
