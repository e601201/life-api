            description: Rename a tag (applies to every entry carrying it)
            operationId: tags#update
            parameters:
                - name: id
                  in: path
                  description: Tag ID
                  required: true
                  schema:
                    type: integer
                    description: Tag ID
                    example: 8661038218069069088
